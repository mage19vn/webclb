<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mage's Tools Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23181818'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='60' fill='%231DB954'>M</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ================= GIAO DIỆN CHUNG ================= */
        :root {
            --bg-main: #1e1e1e; --bg-panel: #2d2d2d; --text-main: #ffffff; --text-sub: #b3b3b3;
            --accent-green: #1DB954; --accent-blue: #1f538d; --danger-red: #e74c3c; --yt-red: #ff0000;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .content-wrapper { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR (Menu trái) */
        .sidebar { width: 250px; background-color: #181818; padding: 20px 0; display: flex; flex-direction: column; border-right: 1px solid #333; transition: all 0.3s ease; }
        .sidebar h2 { text-align: center; color: var(--accent-green); margin-bottom: 30px; }
        .nav-btn { background: none; border: none; color: var(--text-sub); padding: 15px 25px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .nav-btn:hover { color: white; background-color: #282828; }
        .nav-btn.active { color: white; border-left: 4px solid var(--accent-green); background-color: #282828; }

        /* KHU VỰC CHÍNH */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        .tool-section { display: none; width: 100%; max-width: 550px; }
        .tool-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .app-panel { background-color: var(--bg-panel); border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* ================= TOOL 1: QR CODE ================= */
        .qr-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .qr-input-group input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; outline: none; }
        .btn-blue { background: var(--accent-blue); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold;}
        .qr-display { background: white; width: 250px; height: 250px; border-radius: 10px; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; color: gray; }
        .qr-controls { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .qr-controls select, .qr-controls input[type="color"] { padding: 8px; border-radius: 8px; background: #333; color: white; border: 1px solid #444; }
        .btn-red { background: var(--danger-red); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;}
        .btn-green { background: var(--accent-green); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;}

        /* ================= TOOL 2: MUSIC PLAYER ================= */
        .music-header { text-align: center; margin-bottom: 20px; }
        .music-header h3 { margin: 5px 0; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-header p { margin: 0; color: var(--text-sub); font-size: 14px; }
        
        .progress-container { margin: 20px 0; display: flex; align-items: center; gap: 10px; }
        .progress-bar { flex: 1; cursor: pointer; accent-color: var(--accent-green); }
        .time-label { font-size: 12px; color: var(--text-sub); width: 40px; }

        .music-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px;}
        .ctrl-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; transition: 0.2s;}
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn:hover { color: var(--accent-green); }
        .play-btn { background: var(--accent-green); color: var(--bg-main); width: 50px; height: 50px; border-radius: 50%; font-size: 20px; display: flex; justify-content: center; align-items: center; }
        
        .playlist-box { background: #222; border-radius: 8px; padding: 10px; border: 1px solid #333; }
        
        /* Input Add YouTube */
        .yt-input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .yt-input-group input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; outline: none; }
        .btn-yt { background: var(--yt-red); color: white; border: none; padding: 0 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px;}

        .playlist-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .playlist-controls button, .file-upload-label { flex: 1; padding: 8px; text-align: center; background: #333; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 13px; }
        input[type="file"] { display: none; }
        
        .playlist-ul { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        .playlist-ul li { padding: 12px 10px; border-bottom: 1px solid #333; cursor: pointer; font-size: 14px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .playlist-ul li:hover { background: #2a2a2a; }
        .playlist-ul li.playing { color: var(--accent-green); font-weight: bold; }

        /* ================= RESPONSIVE ĐIỆN THOẠI (MOBILE QUERIES) ================= */
        @media screen and (max-width: 768px) {
            /* Chuyển layout từ trái-phải thành trên-dưới */
            .content-wrapper { flex-direction: column; }
            
            /* Biến Sidebar thành thanh Tab ngang phía trên */
            .sidebar { 
                width: 100%; 
                flex-direction: row; 
                padding: 0; 
                border-right: none; 
                border-bottom: 1px solid #333;
                background-color: #121212;
                flex-shrink: 0;
            }
            .nav-btn { 
                flex: 1; 
                text-align: center; 
                padding: 15px 10px; 
                border-left: none; 
                border-bottom: 3px solid transparent; 
                font-size: 15px;
            }
            .nav-btn.active { 
                border-left: none; 
                border-bottom: 3px solid var(--accent-green); 
            }

            /* Thu gọn padding khu vực chính */
            .main-content { padding: 15px 10px; }
            .app-panel { padding: 15px; }

            /* Chuyển các hàng ngang thành cột dọc để dễ bấm trên điện thoại */
            .qr-input-group { flex-direction: column; }
            .btn-blue { padding: 12px; }

            .qr-controls { flex-direction: column; }
            .qr-controls select, .qr-controls input[type="color"] { width: 100%; height: 40px;}

            .yt-input-group { flex-direction: column; }
            .btn-yt { padding: 12px; }

            /* Thu nhỏ khoảng cách nút chơi nhạc */
            .music-controls { gap: 10px; }
            .play-btn { width: 45px; height: 45px; }
            
            /* Ẩn bớt text ở nút header nếu màn hình quá nhỏ */
            .header-back-text { display: none; }
            .header-btn { padding: 8px 12px !important; }
            .header-btn svg { margin: 0 !important; }
        }
    </style>
</head>
<body>

    <header class="h-16 bg-[#050505]/90 backdrop-blur-md border-b border-slate-800 flex items-center px-4 md:px-6 z-20 sticky top-0 shrink-0">
        <div class="flex items-center gap-3 md:gap-4">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-emerald-600 to-green-600 rounded blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                <div class="relative bg-black border border-slate-800 text-white w-9 h-9 flex items-center justify-center rounded-lg font-black text-lg shadow-2xl">
                    <span class="bg-gradient-to-br from-emerald-400 to-green-300 bg-clip-text text-transparent">M</span>
                </div>
            </div>
            <div>
                <h1 class="font-bold text-slate-200 tracking-tight text-sm uppercase leading-tight">MAGE</h1>
                <p class="text-[10px] text-emerald-500 font-semibold tracking-widest hidden md:block">TOOLS HUB</p>
            </div>
        </div>

        <div class="flex items-center gap-2 pl-4 border-l border-slate-800/80 ml-auto"> 
            <button onclick="backToPVT()" class="header-btn relative flex items-center gap-2 pl-4 pr-6 py-2 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg shadow-blue-900/40 transition-all hover:-translate-y-0.5 active:scale-95 active:translate-y-0 border border-white/10 group">
                <svg class="w-4 h-4 text-white mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span class="header-back-text text-xs font-bold tracking-wide">VỀ PVT CODING</span>
            </button>
        </div>
    </header>

    <div class="content-wrapper">
        <div class="sidebar">
            <button class="nav-btn active" onclick="switchTool('music-tool', this)">🎵 Music Player</button>
            <button class="nav-btn" onclick="switchTool('qr-tool', this)">🔲 QR Generator</button>
            <button class="nav-btn" onclick="switchTool('slicer-tool', this)">🖨️ 3D Slicer</button>
        </div>

        <div class="main-content">
            
            <div id="qr-tool" class="tool-section">
                <div class="app-panel">
                    <h3 style="margin-top:0; text-align: center;">QR Code Generator Pro</h3>
                    <div class="qr-input-group">
                        <input type="text" id="urlInput" placeholder="Nhập URL hoặc Nội dung...">
                        <button class="btn-blue" onclick="generateQR()">Tạo QR</button>
                    </div>
                    <div class="qr-display" id="qrFrame">
                        <span id="qrPlaceholder">Mã QR hiển thị ở đây</span>
                        <div id="qrcode"></div>
                    </div>
                    <div class="qr-controls">
                        <select id="colorSelect" onchange="updateQRColor()">
                            <option value="#000000">Đen (Black)</option>
                            <option value="#ff0000">Đỏ (Red)</option>
                            <option value="#1DB954">Xanh Spotify</option>
                            <option value="#1f538d">Xanh dương</option>
                        </select>
                        <input type="color" id="colorPicker" value="#000000" onchange="syncColorPicker()">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-red" onclick="clearQR()">Xóa</button>
                        <button class="btn-green" onclick="saveQR()">Lưu File</button>
                    </div>
                </div>
            </div>

            <div id="music-tool" class="tool-section active">
                <div class="app-panel">
                    <div class="music-header">
                        <h3 id="songTitle">No song selected</h3>
                        <p id="songStatus">Vui lòng tải nhạc lên</p>
                    </div>

                    <div class="progress-container">
                        <span class="time-label" id="currTime">00:00</span>
                        <input type="range" class="progress-bar" id="seekSlider" value="0" min="0" max="100" step="1">
                        <span class="time-label" id="totalTime">00:00</span>
                    </div>

                    <div class="music-controls">
                        <button class="ctrl-btn" onclick="changeVolume(-0.1)">🔉-</button>
                        <button class="ctrl-btn" onclick="prevSong()">⏮</button>
                        <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                        <button class="ctrl-btn" onclick="stopSong()">⏹</button>
                        <button class="ctrl-btn" onclick="nextSong()">⏭</button>
                        <button class="ctrl-btn" onclick="changeVolume(0.1)">🔊+</button>
                    </div>
                    
                    <div style="text-align:center; margin-bottom: 15px; font-size: 12px; color: var(--text-sub);">
                        <span id="volDisplay">Vol: 100%</span> | 
                        <button class="ctrl-btn" style="font-size:14px; padding:0 5px;" id="repeatBtn" onclick="toggleRepeat()">🔁 Off</button> |
                        <button class="ctrl-btn" style="font-size:14px; padding:0 5px;" id="randBtn" onclick="toggleRandom()">🔀 Off</button>
                    </div>

                    <div class="playlist-box">
                        <div class="yt-input-group">
                            <input type="text" id="ytUrlInput" placeholder="Dán link YouTube...">
                            <button class="btn-yt" onclick="addYouTubeSong()">+ Thêm YT</button>
                        </div>

                        <div class="playlist-controls">
                            <label class="file-upload-label">📂 Thêm File (Máy)<input type="file" id="fileInput" multiple accept="audio/*" onchange="loadLocalFiles(event)"></label>
                            <button onclick="clearPlaylist()">🗑️ Xóa List</button>
                        </div>
                        <ul class="playlist-ul" id="playlistUI"></ul>
                    </div>

                    <div id="ytPlayerContainer" style="display: none;"></div>
                </div>
            </div>

            <div id="slicer-tool" class="tool-section">
                <div class="app-panel" style="padding: 0; overflow: hidden; height: 600px; display: flex; flex-direction: column;">
                    
                    <div style="padding: 15px; background: var(--bg-panel); border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="margin:0; color: var(--accent-green);">Kiri:Moto Web Slicer</h3>
                        <span style="font-size: 12px; color: var(--text-sub);">Chạy 100% trên trình duyệt</span>
                    </div>

                    <div style="flex: 1; background: #000;">
                        <iframe 
                            src="https://grid.space/kiri/?smode=FDM" 
                            width="100%" 
                            height="100%" 
                            frameborder="0" 
                            style="border-radius: 0 0 12px 12px;">
                        </iframe>
                    </div>
                    
                </div>
            </div>

        </div>
    </div> 
    
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- HÀM QUAY LẠI TRANG PVT CODING ---
        function backToPVT() {
            window.location.href = '../robocon.html'; 
        }

        // --- CHUYỂN TAB ---
        function switchTool(toolId, btnElement) {
            document.querySelectorAll('.tool-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(toolId).classList.add('active');
            btnElement.classList.add('active');
        }

        // --- TOOL 1: QR CODE ---
        let qrCodeObj = null; let qrColor = "#000000";
        function updateQRColor() { qrColor = document.getElementById("colorSelect").value; document.getElementById("colorPicker").value = qrColor; if(document.getElementById("urlInput").value) generateQR(); }
        function syncColorPicker() { qrColor = document.getElementById("colorPicker").value; document.getElementById("colorSelect").value = "#000000"; if(document.getElementById("urlInput").value) generateQR(); }
        function generateQR() { const t = document.getElementById("urlInput").value.trim(); if(!t)return alert("Nhập nội dung!"); document.getElementById("qrPlaceholder").style.display="none"; document.getElementById("qrcode").innerHTML=""; qrCodeObj = new QRCode(document.getElementById("qrcode"), {text: t, width: 230, height: 230, colorDark: qrColor, colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H}); }
        function clearQR() { document.getElementById("urlInput").value = ""; document.getElementById("qrcode").innerHTML = ""; document.getElementById("qrPlaceholder").style.display = "block"; }
        function saveQR() { const c = document.querySelector("#qrcode canvas"); if(!c) return alert("Chưa có mã!"); const l = document.createElement("a"); l.href = c.toDataURL("image/png"); l.download = "QR_Code.png"; l.click(); }

        // --- TOOL 2: MUSIC PLAYER (TÍCH HỢP YOUTUBE + LOCAL) ---
        const audio = new Audio();
        let ytPlayer = null;
        let isYtReady = false;
        
        let playlist = []; // Chứa object: {type: 'local', file: File, name: 'Tên'} HOẶC {type: 'youtube', id: 'vidID', name: 'Tên YT'}
        let currentIndex = -1;
        let currentVol = 1.0;
        let isRepeating = false; let isRandom = false;

        const songTitle = document.getElementById("songTitle"); const songStatus = document.getElementById("songStatus");
        const playPauseBtn = document.getElementById("playPauseBtn"); const seekSlider = document.getElementById("seekSlider");

        function formatTime(sec) {
            if(isNaN(sec)) return "00:00";
            let m = Math.floor(sec/60); let s = Math.floor(sec%60);
            return `${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
        }

        // 1. Khởi tạo YouTube IFrame Player (Chạy ngầm)
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayerContainer', {
                height: '0', width: '0', videoId: '',
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,            // Không load video đề xuất từ kênh khác
                    'iv_load_policy': 3  // Ẩn các chú thích quảng cáo nhỏ
                },
                events: { 'onReady': () => isYtReady = true, 'onStateChange': onYtStateChange }
            });
        }

        // 2. Tách ID từ link YouTube
        function getYouTubeID(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 3. Thêm nhạc từ Link YouTube
        async function addYouTubeSong() {
            const url = document.getElementById("ytUrlInput").value.trim();
            const vidId = getYouTubeID(url);
            if(!vidId) return alert("Link YouTube không hợp lệ!");

            songStatus.innerText = "Đang nạp link...";
            try {
                // Mẹo nhỏ: Gọi web NoEmbed để lấy tên video YouTube mà không bị chặn
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await res.json();
                const title = data.title || `YouTube Audio (${vidId})`;
                playlist.push({ type: 'youtube', id: vidId, name: "📺 " + title });
            } catch(e) {
                playlist.push({ type: 'youtube', id: vidId, name: `📺 YouTube Audio (${vidId})` });
            }

            document.getElementById("ytUrlInput").value = "";
            renderPlaylist();
            if(currentIndex === -1) { currentIndex = 0; loadSong(currentIndex); } 
            else songStatus.innerText = "Đã thêm vào danh sách";
        }

        // 4. Thêm file nhạc từ máy
        function loadLocalFiles(event) {
            const files = event.target.files;
            if(files.length === 0) return;
            for(let f of files) playlist.push({ type: 'local', file: f, name: "🎵 " + f.name });
            renderPlaylist();
            if(currentIndex === -1) { currentIndex = 0; loadSong(currentIndex); }
        }

        function renderPlaylist() {
            const ul = document.getElementById("playlistUI"); ul.innerHTML = "";
            playlist.forEach((track, idx) => {
                let li = document.createElement("li");
                li.innerText = `${idx + 1}. ${track.name}`;
                if(idx === currentIndex) li.className = "playing";
                li.onclick = () => { currentIndex = idx; loadSong(idx); };
                ul.appendChild(li);
            });
        }

        // 5. Hàm Load Nhạc (Phân luồng Local hay YouTube)
        function loadSong(index) {
            if(playlist.length === 0) return;
            const track = playlist[index];
            songTitle.innerText = track.name;
            renderPlaylist();
            songStatus.innerText = "Đang tải...";
            
            // Ép cả 2 player dừng lại trước
            audio.pause(); 
            if(isYtReady && ytPlayer.stopVideo) ytPlayer.stopVideo();

            if (track.type === 'local') {
                audio.src = URL.createObjectURL(track.file);
                audio.play();
            } else if (track.type === 'youtube') {
                if(!isYtReady) return songStatus.innerText = "Lỗi: Hệ thống YouTube chưa tải xong";
                ytPlayer.loadVideoById(track.id);
                ytPlayer.playVideo();
            }
        }

        // 6. Điều khiển Play/Pause dùng chung
        function togglePlay() {
            if(playlist.length === 0) return alert("Thêm nhạc vào danh sách trước nhé!");
            const track = playlist[currentIndex];
            if(track.type === 'local') {
                audio.paused ? audio.play() : audio.pause();
            } else {
                let state = ytPlayer.getPlayerState();
                state === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); // 1 = Đang phát
            }
        }

        function stopSong() {
            audio.pause(); audio.currentTime = 0;
            if(isYtReady) { ytPlayer.stopVideo(); ytPlayer.seekTo(0); }
            playPauseBtn.innerText = "▶"; songStatus.innerText = "Đã dừng";
        }

        function nextSong() {
            if(playlist.length === 0) return;
            if(isRandom) currentIndex = Math.floor(Math.random() * playlist.length);
            else {
                currentIndex++;
                if(currentIndex >= playlist.length) {
                    if(isRepeating) currentIndex = 0; else { currentIndex = playlist.length - 1; stopSong(); return; }
                }
            }
            loadSong(currentIndex);
        }

        function prevSong() {
            if(playlist.length === 0) return;
            currentIndex--;
            if(currentIndex < 0) currentIndex = isRepeating ? playlist.length - 1 : 0;
            loadSong(currentIndex);
        }

        function changeVolume(amount) {
            currentVol += amount;
            if(currentVol > 1) currentVol = 1; if(currentVol < 0) currentVol = 0;
            audio.volume = currentVol;
            if(isYtReady) ytPlayer.setVolume(currentVol * 100);
            document.getElementById("volDisplay").innerText = `Vol: ${Math.round(currentVol * 100)}%`;
        }

        // Nút Toggle trạng thái
        function toggleRepeat() { isRepeating = !isRepeating; document.getElementById("repeatBtn").innerText = isRepeating ? "🔁 On" : "🔁 Off"; }
        function toggleRandom() { isRandom = !isRandom; document.getElementById("randBtn").innerText = isRandom ? "🔀 On" : "🔀 Off"; }
        function clearPlaylist() { stopSong(); playlist = []; currentIndex = -1; renderPlaylist(); songTitle.innerText="No song selected"; songStatus.innerText="Vui lòng tải nhạc lên"; }

        // 7. Đồng bộ Thanh Thời Gian & Trạng thái UI (Quan trọng)

        // Đối với Local File
        audio.onloadedmetadata = () => { seekSlider.max = audio.duration; document.getElementById("totalTime").innerText = formatTime(audio.duration); songStatus.innerText = "Đang phát (File máy)"; playPauseBtn.innerText = "⏸";};
        audio.ontimeupdate = () => { if(playlist[currentIndex]?.type === 'local') { seekSlider.value = audio.currentTime; document.getElementById("currTime").innerText = formatTime(audio.currentTime); } };
        audio.onpause = () => { if(playlist[currentIndex]?.type === 'local') { playPauseBtn.innerText = "▶"; songStatus.innerText = "Tạm dừng"; } };
        audio.onplay = () => { if(playlist[currentIndex]?.type === 'local') { playPauseBtn.innerText = "⏸"; songStatus.innerText = "Đang phát (File máy)"; } };
        audio.onended = () => { if(playlist[currentIndex]?.type === 'local') nextSong(); };

        // Đối với YouTube File (Cần dùng vòng lặp interval vì YouTube API không có hàm ontimeupdate)
        setInterval(() => {
            if(playlist.length > 0 && playlist[currentIndex]?.type === 'youtube' && isYtReady && ytPlayer.getPlayerState() === 1) {
                let curr = ytPlayer.getCurrentTime(); let total = ytPlayer.getDuration();
                seekSlider.max = total; seekSlider.value = curr;
                document.getElementById("currTime").innerText = formatTime(curr);
                document.getElementById("totalTime").innerText = formatTime(total);
            }
        }, 500);

        function onYtStateChange(event) {
            if(playlist[currentIndex]?.type !== 'youtube') return;
            if(event.data === YT.PlayerState.PLAYING) { playPauseBtn.innerText = "⏸"; songStatus.innerText = "Đang phát (YouTube)"; }
            else if(event.data === YT.PlayerState.PAUSED) { playPauseBtn.innerText = "▶"; songStatus.innerText = "Tạm dừng"; }
            else if(event.data === YT.PlayerState.ENDED) { nextSong(); }
        }

        // Kéo thanh trượt để tua
        seekSlider.addEventListener('input', () => {
            let track = playlist[currentIndex];
            if(!track) return;
            if(track.type === 'local') audio.currentTime = seekSlider.value;
            else if(track.type === 'youtube' && isYtReady) ytPlayer.seekTo(seekSlider.value, true);
        });

    </script>
</body>
</html>
